name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  NODE_ENV: test
  TEST_DATABASE: "1"
  APP_NETWORK_MODE: lan
  LOCAL_ADMIN_NO_AUTH: "0"
  CLUSTER_WORKERS: "1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meyouquize_test
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/meyouquize_test
  ADMIN_LOGIN: admin
  ADMIN_PASSWORD: ci-test-admin-password
  CLIENT_ORIGIN: http://127.0.0.1:5173
  ADMIN_ACCOUNTS: '[{"login":"admin","password":"ci-test-admin-password"}]'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: shared/coverage/lcov.info,server/coverage/lcov.info,client/coverage/lcov.info

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meyouquize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Prisma generate
        run: npm run prisma:generate -w server

      - name: Integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meyouquize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build shared
        run: npm run build -w shared

      - name: Prisma generate
        run: npm run prisma:generate -w server

      - name: Migrate test database
        working-directory: server
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e
